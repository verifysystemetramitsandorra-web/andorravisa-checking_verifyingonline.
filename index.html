
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Check Status</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #eceff1;
            --card: #ffffff;
            --purple1: #7b1fa2;
            --purple2: #9c27b0;
            --blue: #1f4f82;
            --blue2: #2b5d92;
            --blueHover: #163c66;
            --text: #37474f;
            --text2: #607d8b;
            --border: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            font-family: 'Roboto', sans-serif;
            color: var(--text);
        }

        .gov-header {
            width: 100%;
            background: var(--blue);
            box-shadow: 0 3px 12px rgba(0,0,0,.18);
        }

        .gov-top {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 22px 15px 18px;
        }

        .gov-logo {
            width: 58px;
            height: auto;
            margin-bottom: 10px;
        }

        .gov-title {
            color: white;
            font-size: 26px;
            font-weight: 700;
            text-align: center;
            letter-spacing: 0.8px;
            text-transform: uppercase;
            line-height: 1.25;
        }

        .gov-nav {
            background: var(--blue2);
        }

        .gov-nav a {
            display: block;
            text-align: center;
            color: white;
            text-decoration: none;
            padding: 13px;
            font-size: 16px;
            font-weight: 600;
        }

        .gov-nav a:hover {
            background: var(--blueHover);
        }

        .page {
            display: flex;
            justify-content: center;
            padding: 30px 15px;
        }

        .status-card {
            width: 100%;
            max-width: 480px;
            background: var(--card);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 3px 15px rgba(0,0,0,.12);
        }

        .card-header {
            background: linear-gradient(135deg, var(--purple1), var(--purple2));
            color: white;
            text-align: center;
            padding: 16px;
            position: relative;
        }

        .card-title {
            font-size: 19px;
            font-weight: 500;
        }

        .close-btn {
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            background: none;
            border: none;
            color: white;
            font-size: 26px;
            cursor: pointer;
            line-height: 1;
        }

        .status-row {
            display: grid;
            grid-template-columns: 145px 1fr;
            gap: 10px;
            padding: 16px 18px;
            border-bottom: 1px solid var(--border);
        }

        .status-row:last-child {
            border-bottom: none;
        }

        .status-label {
            font-weight: 700;
            color: var(--text);
            font-size: 15px;
        }

        .status-value {
            color: var(--text2);
            font-size: 15px;
            word-break: break-word;
        }

        .status-value.multiline {
            display: flex;
            flex-direction: column;
            gap: 5px;
            line-height: 1.45;
        }

        .card-footer {
            padding: 22px;
            text-align: center;
        }

        .refresh-btn {
            background: #1a237e;
            color: white;
            border: none;
            border-radius: 30px;
            padding: 13px 42px;
            cursor: pointer;
            font-size: 15px;
            font-weight: 700;
            letter-spacing: 0.4px;
        }

        .refresh-btn:hover {
            background: #283593;
        }

        .loading {
            text-align: center;
            padding: 40px 20px;
            color: var(--text2);
            display: none;
        }

        .spinner {
            width: 36px;
            height: 36px;
            margin: 0 auto 14px;
            border: 4px solid #ddd;
            border-top: 4px solid var(--purple2);
            border-radius: 50%;
            animation: spin 0.8s linear infinite;
        }

        @keyframes spin {
            to { transform: rotate(360deg); }
        }

        @media (max-width: 500px) {
            .gov-title {
                font-size: 22px;
            }
            .status-row {
                grid-template-columns: 125px 1fr;
                font-size: 14px;
            }
        }
    </style>
</head>
<body>

<header class="gov-header">
    <div class="gov-top">
        <img src="https://verifysystemetramitsad.github.io/andorravisa-checking_verifyingonline/ga-logo%20(3).png" 
             alt="Govern d'Andorra" class="gov-logo"
             onerror="this.style.display='none'">
        <div style="color:rgba(255,255,255,0.9); font-size:13px; margin-bottom:6px;">Govern d'Andorra</div>
        <h1 class="gov-title">ELECTRONICS<br>HEADQUARTERS</h1>
    </div>

    <nav class="gov-nav">
        <a href="https://www.e-tramits.ad/tramits/" target="_blank">Home</a>
    </nav>
</header>

<div class="page">
    <div class="status-card">

        <header class="card-header">
            <h1 class="card-title">Check Status</h1>
            <button type="button" class="close-btn" onclick="window.history.back()">×</button>
        </header>

        <!-- Loading -->
        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p>Loading status...</p>
        </div>

        <!-- Actual Content (yeh hamesha dikhega) -->
        <div id="content">
            <div class="status-row">
                <div class="status-label">Application ID</div>
                <div class="status-value">92334947121347</div>
            </div>
            <div class="status-row">
                <div class="status-label">Name</div>
                <div class="status-value">MUHAMMAD ILYAS</div>
            </div>
            <div class="status-row">
                <div class="status-label">Nationality</div>
                <div class="status-value">PAKISTAN</div>
            </div>
            <div class="status-row">
                <div class="status-label">Passport Number</div>
                <div class="status-value">HK1744601</div>
            </div>
            <div class="status-row">
                <div class="status-label">Status</div>
                <div class="status-value multiline">
                    <span>Visa Granted on 21/10/2026</span>
                    <span>Visa Grant No.2026072522042</span>
                    <span>E-Visa Sent via Email to Registered Email Address.</span>
                </div>
            </div>
        </div>

        <footer class="card-footer">
            <button type="button" class="refresh-btn" onclick="refreshPage()">REFRESH</button>
        </footer>

    </div>
</div>

<script>
    function refreshPage() {
        const loading = document.getElementById('loading');
        const content = document.getElementById('content');

        loading.style.display = 'block';
        content.style.display = 'none';

        setTimeout(function() {
            loading.style.display = 'none';
            content.style.display = 'block';
        }, 900);
    }
</script>

</body>
</html>
